# Run after the pipeline has finished (dvc repro): `docker compose up --build`
#   API:       http://localhost:8000/docs
#   MLflow UI: http://localhost:5000
# The project folder is mounted at /app, so both services see data/, artifacts/, mlflow.db and mlruns/.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mlflow:
    build: .
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - .:/app
