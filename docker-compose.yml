# Local demo: `make demo` (synthetic data + dvc repro) then `docker compose up --build`.
# mlflow serves the tracking store/registry that `register` already populated on the host;
# api loads the champion model from it and serves /score on the synthetic artifacts.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow-data/mlflow.db
      --default-artifact-root /mlflow-data/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TAOBAO_PROFILE: synthetic
      TAOBAO_DATA_DIR: /app/data
      TAOBAO_ARTIFACT_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro

volumes:
  mlflow-data:
